name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          # macos-latest es Apple Silicon (arm64). Intel no se soporta.
          - name: macos (apple silicon)
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Las pruebas de prompt ejecutan fish y zsh de verdad si están instalados.
      - name: Instalar shells (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish zsh

      - name: Instalar shells (macos)
        if: runner.os == 'macOS'
        run: brew install bash fish

      - name: Verificar arquitectura
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: install.sh
        run: |
          BATON_MAN_DIR="$RUNNER_TEMP/man" scripts/install.sh --dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/baton" version
          scripts/install.sh --dir "$RUNNER_TEMP/bin" --rollback
