[package]
name = "baton"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "baton"
path = "src/main.rs"

[dependencies]
baton-core = { version = "0.1.0", path = "../baton-core" }
baton-exec = { version = "0.1.0", path = "../baton-exec" }
baton-store = { version = "0.1.0", path = "../baton-store" }
baton-tui = { version = "0.1.0", path = "../baton-tui" }
clap = { version = "4.6.7", features = ["derive"] }
inquire = "0.9.4"

[dev-dependencies]
tempfile = "3.27.0"
