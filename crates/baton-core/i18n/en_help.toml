"Primeros pasos:\n  baton init               prepara el proyecto y abre su primer plan para editarlo\n  baton import <archivo>   o arma el plan desde un pipeline de GitHub, GitLab o Azure\n  baton start [plan]       abre un plan: revisarlo, editarlo y ejecutarlo (p cambia de plan)\n  baton run [plan]         ejecuta un plan directo\n  baton create <plan>      crea un plan vacío\n  baton copy|rename|delete administra los planes (copiar, renombrar, eliminar)\n  baton config             destinos, logs y credenciales del proyecto\n  baton                    sin argumentos: muestra el estado del proyecto\n\nPara scripts bash (la pregunta va a la terminal, solo la respuesta a stdout):\n  env=$(baton select \"¿Ambiente?\" dev staging prod)\n  baton confirm \"¿Seguimos?\" --default no && echo listo\n  (también multiselect e input; sin terminal se responde con BATON_<NOMBRE> o --default)" = "Getting started:\n  baton init               sets up the project and opens its first plan to edit\n  baton import <file>      or builds the plan from a GitHub, GitLab or Azure pipeline\n  baton start [plan]       opens a plan: review it, edit it and run it (p switches plan)\n  baton run [plan]         runs a plan directly\n  baton create <plan>      creates an empty plan\n  baton copy|rename|delete manages plans (copy, rename, delete)\n  baton config             targets, logs and credentials of the project\n  baton                    with no arguments: shows the project status\n\nFor bash scripts (the question goes to the terminal, only the answer to stdout):\n  env=$(baton select \"Environment?\" dev staging prod)\n  baton confirm \"Continue?\" --default no && echo done\n  (also multiselect and input; without a terminal they are answered with BATON_<NAME> or --default)"
