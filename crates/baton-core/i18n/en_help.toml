"Nombre del plan (por defecto, el de la carpeta)" = "Plan name (by default, the folder name)"
"Nombre del plan (por defecto, el del archivo)" = "Plan name (by default, the file name)"
"Nombre del plan; sin él, el único del proyecto o se pregunta" = "Plan name; without it, the only one in the project or it asks"
