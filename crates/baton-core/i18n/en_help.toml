"Cambia el nombre de un plan (conserva su historial de ejecuciones)" = "Renames a plan (keeps its run history)"
"Cambia una clave en la configuración global (o en la del proyecto con --project)" = "Changes a key in the global configuration (or in the project one with --project)"
"Carpeta del proyecto (por defecto, la actual o la primera superior que sea un proyecto baton)" = "Project folder (by default, the current one or the first parent that is a baton project)"
"Con la acción logs, sigue mostrándolos en vivo (ctrl+c para cortar)" = "With the logs action, keeps showing them live (ctrl+c to stop)"
"Configuración global de la app y de dónde sale cada valor (no necesita proyecto)" = "Global app settings and where each value comes from (needs no project)"
