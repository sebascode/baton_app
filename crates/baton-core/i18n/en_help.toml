# Descripciones de `--help` (comandos y opciones): la clave es el texto en español del código.
# La prueba de baton-cli/src/clap_i18n.rs exige que cada texto de ayuda tenga su entrada y que no sobre ninguna.
"Abre un plan para revisarlo, editarlo y ejecutarlo; si no existe, lo crea vacío" = "Opens a plan to review, edit and run it; if it does not exist, creates it empty"
"Abre una sesión interactiva (se abre sola con una base, sin consulta y en una terminal)" = "Opens an interactive session (it opens on its own with a database, no query and a terminal)"
"Acorta las esperas del escenario para probar rápido" = "Shortens the scenario waits for a quick try"
"Agrega cómo terminó la última ejecución (cambia con cada ejecución)" = "Adds how the last run ended (it changes with every run)"
"Ambiente de los comandos de rollback que usan {ambiente} y de las credenciales" = "Environment for rollback commands that use {ambiente} and for the credentials"
"Ambiente del que se resuelven las credenciales" = "Environment the credentials are resolved from"
"Ambiente: carpeta de credenciales (`.baton/credentials/<ambiente>/`) y valor de {ambiente} (sin él: la variable BATON_AMBIENTE o `ambiente` en [defaults] de .baton/config.toml)" = "Environment: credentials folder (`.baton/credentials/<ambiente>/`) and value of {ambiente} (without it: the BATON_AMBIENTE variable or `ambiente` in [defaults] of .baton/config.toml)"
"Ambientes a crear, separados por coma (ej. dev,staging,prod)" = "Environments to create, separated by commas (e.g. dev,staging,prod)"
"Archivo del pipeline (ej. .github/workflows/deploy.yml, .gitlab-ci.yml)" = "Pipeline file (e.g. .github/workflows/deploy.yml, .gitlab-ci.yml)"
"Base a consultar (el id de su credencial); sin él, la única del plan" = "Database to query (its credential id); without it, the only one in the plan"
"Busca una versión nueva de baton en GitHub y la instala (no necesita proyecto)" = "Looks for a new baton version on GitHub and installs it (needs no project)"
