[package]
name = "baton-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
baton-core = { version = "0.4.0", path = "../baton-core" }
baton-store = { version = "0.4.0", path = "../baton-store" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
humantime = "2.4.0"
tokio = { version = "1.53.1", features = ["rt", "process", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
