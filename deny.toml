# Política de dependencias (cargo deny). Cambiarla exige la aprobación de CODEOWNERS.
#
# Baton no abre conexiones de red por su cuenta: para eso usa los binarios del sistema
# (ssh, rsync, curl) con destinos que la persona configuró. Por eso un crate de red nuevo
# no entra por accidente en un PR: hay que editar esta lista a la vista de quien revisa.

[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
]

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
    # clientes y servidores HTTP
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "hyper-util" },
    { crate = "ureq" },
    { crate = "isahc" },
    { crate = "attohttpc" },
    { crate = "surf" },
    { crate = "curl" },
    { crate = "curl-sys" },
    { crate = "h2" },
    { crate = "axum" },
    { crate = "actix-web" },
    # sockets web y TLS
    { crate = "tungstenite" },
    { crate = "tokio-tungstenite" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "rustls" },
    # telemetría y reporte de errores
    { crate = "sentry" },
    { crate = "opentelemetry" },
    { crate = "opentelemetry-otlp" },
    { crate = "posthog-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
