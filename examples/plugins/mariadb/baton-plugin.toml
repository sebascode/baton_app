# Plugin de ejemplo: MariaDB, un script .sql por archivo con el cliente `mariadb`.
#
# Por qué existe: las imagenes de MariaDB 11 o mas ya no traen `mysql` ni `mysqldump`, solo
# `mariadb` y `mariadb-dump`, y el tipo `sql` de baton llama a `mysql`. Este plugin hace lo mismo
# para esos casos: ejecuta cada archivo con `mariadb`, en orden por nombre y dentro de su carpeta.
#
# Instalar a mano: copiar esta carpeta a ~/.config/baton/plugins/mariadb/ (o a baton/plugins/ del
# proyecto) y revisarla antes con
#   baton plugin validate ~/.config/baton/plugins/mariadb
#
# Uso en un plan:
#   [[credentials]]
#   id = "tienda"
#   kind = "mariadb"
#   ref = "db.env#TIENDA"          # TIENDA_USER, TIENDA_PASSWORD, y opcionales _HOST _PORT _DATABASE
#
#   [[steps]]
#   id = "esquema"
#   name = "Esquema"
#   type = "mariadb"
#   source = "db/*.sql"
#
# Dentro de un contenedor (el caso de MariaDB 11): el cliente no esta en esta maquina, asi que el
# paso reescribe `command`. La contrasena llega por el entorno (MYSQL_PWD), nunca en un argumento:
#   command = 'docker exec -i -e MYSQL_PWD mi-mariadb mariadb -u "$MARIADB_USER" "$MARIADB_DATABASE" < "{script}"'
#
# Capacidades de api = 2 (cada una vale solo porque este manifiesto la declara):
#   backup + restore   con `backup_before = true` en el paso, antes de ejecutarlo se vuelca la base
#                      a .baton/backups/<plan>-<fecha>-<id del paso>.sql (una vez por ejecucion) y,
#                      si el plan se deshace y el paso no declara `rollback`, se restaura ese volcado.
#                      Respeta el interruptor general de backup ([options] backup, --no-backup).
#   scan               pide confirmar (o --assume-yes sin terminal) si algun .sql del paso contiene
#                      DROP, TRUNCATE o DELETE FROM. Es una busqueda de texto: avisa de mas, por
#                      ejemplo un DELETE FROM con WHERE.
#   test (credencial)  la prueba de conexion de la pantalla de credenciales.
#
# Lo que este plugin NO hace: `baton db` no consulta la base. Y el respaldo y la restauracion usan el
# cliente `mariadb-dump` / `mariadb` de esta maquina: dentro de un contenedor, el paso reescribe
# `command` (arriba), pero backup y restore no se pueden reescribir por paso; ahi conviene un
# `rollback` propio en el paso o un `mariadb-dump` en el PATH que entre por `docker exec`.
api = 2
name = "mariadb"
version = "0.1.0"
description = "MariaDB: ejecuta cada .sql con el cliente mariadb (para imagenes de MariaDB 11 o mas)"

[type]
scanned = true
backup_ext = "sql"
backup = 'mariadb-dump ${MARIADB_HOST:+-h "$MARIADB_HOST"} ${MARIADB_PORT:+-P "$MARIADB_PORT"} -u "$MARIADB_USER" --single-transaction --routines --triggers "$MARIADB_DATABASE" > {backup_file}'
restore = 'mariadb ${MARIADB_HOST:+-h "$MARIADB_HOST"} ${MARIADB_PORT:+-P "$MARIADB_PORT"} -u "$MARIADB_USER" "$MARIADB_DATABASE" < {backup_file}'
scan = ["DROP ", "TRUNCATE ", "DELETE FROM "]
command = 'mariadb --batch ${MARIADB_HOST:+-h "$MARIADB_HOST"} ${MARIADB_PORT:+-P "$MARIADB_PORT"} -u "$MARIADB_USER" ${MARIADB_DATABASE:+"$MARIADB_DATABASE"} < "{script}"'

[[credentials]]
kind = "mariadb"
fields = [
  { key = "USER" },
  { key = "PASSWORD", secret = true },
  { key = "HOST", optional = true },
  { key = "PORT", optional = true },
  { key = "DATABASE", optional = true },
]

# solo lectura; recibe las variables de [credentials.env]
test = '''mariadb --connect-timeout=5 ${MARIADB_HOST:+-h "$MARIADB_HOST"} ${MARIADB_PORT:+-P "$MARIADB_PORT"} -u "$MARIADB_USER" ${MARIADB_DATABASE:+"$MARIADB_DATABASE"} -N -B -e "select concat(ifnull(database(), 'sin base'), ' como ', current_user())"'''

[credentials.env]
MARIADB_USER = "{USER}"
MYSQL_PWD = "{PASSWORD}"
MARIADB_HOST = "{HOST}"
MARIADB_PORT = "{PORT}"
MARIADB_DATABASE = "{DATABASE}"
