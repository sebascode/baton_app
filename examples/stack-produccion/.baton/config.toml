# Configuración local de esta máquina (en un proyecto real, .baton/ va en .gitignore).
version = 1

[defaults]
target = "local"

[targets.local]
type = "local"

[targets.prod-app]
type = "ssh"
host = "10.0.4.12"
port = 22
user = "deploy"
credential = "servers.env#PROD_APP"
remote_dir = "/opt/stack"
sync = true

[targets.bastion]
type = "ssh"
host = "203.0.113.5"
user = "jump"
credential = "servers.env#BASTION"
sync = false

[targets.prod-db]
type = "ssh"
host = "10.0.4.20"
user = "deploy"
credential = "servers.env#PROD_DB"
remote_dir = "/opt/db"
bastion = "bastion"
sync = true

[targets.swarm-qa]
type = "context"
context = "qa-swarm"

[logs]
local = "~/baton-logs/{plan}/{fecha}.log"
remote = "/var/log/baton/"
format = "json"

[logs.retention]
days = 30
max_size = "500MB"

[logs.export]
enabled = false
